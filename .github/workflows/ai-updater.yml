# North Star Watchdog - AI Updater
# Runs hourly to scan news and update the tracking database
#
# ═══════════════════════════════════════════════════════════════
# AGENT CODENAME: POLARIS
# MISSION: Uncover fraud in Minnesota. Self-heal. Learn. Report.
# ═══════════════════════════════════════════════════════════════
#
# REQUIRED SECRETS:
# - GROQ_API_KEY (FREE: https://console.groq.com/keys)
#
# OPTIONAL SECRETS (for X/Twitter integration):
# - X_API_KEY
# - X_API_SECRET
# - X_ACCESS_TOKEN
# - X_ACCESS_SECRET
#
# FREE APIs USED (no keys needed):
# - Google News RSS
# - ProPublica Nonprofits
# - FEC Campaign Finance
# - OIG Exclusions
# - OpenCorporates
# - USASpending.gov
# - SEC EDGAR
# - OSHA
# - FDA
# - HUD
# - MN Campaign Finance Board
# - MN DHS Licensing
# - MN Transparency Portal
#
# CAPABILITIES:
# - Hourly news scanning (33+ search queries)
# - AI analysis with auto model fallback
# - OSINT enrichment from 13 free APIs
# - Self-awareness (understands own codebase)
# - Self-healing (auto-fixes issues)
# - Self-learning (discovers new entities)
# - X/Twitter posting & monitoring
# - GitHub Issues for critical findings
#

name: AI Updater

on:
  schedule:
    - cron: '0 * * * *'  # Every hour
  workflow_dispatch:  # Manual trigger
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'data/**'

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Initialize Self-Awareness (daily)
        run: |
          # Run self-awareness scan once per day (at midnight UTC) or if missing
          HOUR=$(date -u +%H)
          if [ "$HOUR" = "00" ] || [ ! -f "data/self-awareness.json" ]; then
            echo "🧠 Running self-awareness scan..."
            node scripts/ai-self-awareness.js || echo "Self-awareness scan skipped"
          else
            echo "⏭️ Self-awareness scan runs at midnight UTC"
          fi
      
      - name: Run AI Updater
        env:
          # Required
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # X/Twitter Integration (optional)
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: node scripts/ai-core.js
      
      - name: Commit and push changes
        run: |
          git config --local user.email "ai-bot@north-star-watchdog.local"
          git config --local user.name "North Star AI Bot"
          git add -A
          git diff --staged --quiet || git commit -m "🤖 Hourly AI update - $(date +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase || true
          git push
