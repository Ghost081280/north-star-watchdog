# North Star Watchdog - AI Updater
# Runs hourly to scan news and update the tracking database
#
# REQUIRED SECRET:
# - GROQ_API_KEY (FREE: https://console.groq.com/keys)
#
# FREE APIs USED (no keys needed):
# - Google News RSS
# - ProPublica Nonprofits
# - FEC Campaign Finance
# - OIG Exclusions
# - OpenCorporates
# - USASpending.gov
#
# SELF-LEARNING:
# - AI discovers new entities and adds them to learning.json
# - New search queries are created automatically
# - Each scan builds on previous findings
#

name: AI Updater

on:
  schedule:
    - cron: '0 * * * *'  # Every hour
  workflow_dispatch:  # Manual trigger
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'data/**'

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Run AI Updater
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ai-core.js
      
      - name: Commit and push changes
        run: |
          git config --local user.email "ai-bot@north-star-watchdog.local"
          git config --local user.name "North Star AI Bot"
          git add -A
          git diff --staged --quiet || git commit -m "🤖 Hourly AI update - $(date +'%Y-%m-%d %H:%M') CST"
          git push
